name: Deploy to HuggingFace Spaces

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to HuggingFace Spaces (with retry)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "deploy@github-actions.com"
          git config --global user.name "GitHub Actions"
          git remote add hf https://Dev176:$HF_TOKEN@huggingface.co/spaces/Dev176/openenv-sql-query-env

          for i in 1 2 3 4 5; do
            echo "Push attempt $i..."
            git push hf main --force && echo "Push succeeded" && exit 0
            echo "Attempt $i failed, waiting 15s..."
            sleep 15
          done

          echo "All 5 push attempts failed"
          exit 1
