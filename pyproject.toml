[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "tempo-sql-analytics-env"
version = "2.0.0"
description = "OpenEnv-compliant SQL Query Agent Environment for the Meta x PyTorch Hackathon 2026"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "openai>=2.7.2",
    "openenv-core>=0.2.0",
]

[project.scripts]
server = "server.app:main"

[tool.openenv]
entry_point = "src/environment/env.py"
class = "SQLQueryEnv"
config = "openenv.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
