name: openenv-sql-query-env
version: "1.0.0"
description: >
  An OpenEnv-compliant environment where an AI agent writes SQL queries
  to answer natural language business intelligence questions about an
  in-memory SQLite database (employees, projects, assignments).
author: "Devesh B"

environment:
  type: custom
  entry_point: src/environment/env.py
  class: SQLQueryEnv

tasks:
  - id: task_easy
    name: "Easy — Single Table Queries"
    difficulty: easy
    description: "Query a single table using SELECT, WHERE, GROUP BY, ORDER BY, LIMIT."
    grader: src/graders/task_easy_grader.py

  - id: task_medium
    name: "Medium — JOINs and Aggregations"
    difficulty: medium
    description: "Join multiple tables and compute aggregations across them."
    grader: src/graders/task_medium_grader.py

  - id: task_hard
    name: "Hard — Window Functions and Subqueries"
    difficulty: hard
    description: "Use window functions, subqueries, and CTEs for complex analytical queries."
    grader: src/graders/task_hard_grader.py

api:
  host: 0.0.0.0
  port: 8000
  endpoints:
    - /reset
    - /step
    - /state
    - /tasks
    - /grader
    - /baseline
    - /health
    - /mcp
