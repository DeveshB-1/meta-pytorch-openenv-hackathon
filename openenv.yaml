name: tempo-sql-analytics-env
version: "2.0.0"
description: >
  An OpenEnv-compliant RL environment where an AI agent writes SQL queries
  to answer natural-language analytics questions about Tempo, a music
  streaming platform. The SQLite database covers artists, songs, users,
  streams (with skip/completion/source data), and playlists across
  30 artists, 110 songs, 75 users, 650 streams, 50 playlists.
author: "Devesh B"

environment:
  type: custom
  entry_point: src/environment/env.py
  class: SQLQueryEnv

tasks:
  - id: task_easy
    name: "Easy — Tempo Single-Table Queries"
    difficulty: easy
    description: "Query artists, songs, and users using SELECT, WHERE, GROUP BY, ORDER BY, LIMIT."
    grader: src/graders/task_easy_grader.py

  - id: task_medium
    name: "Medium — Tempo JOINs and Aggregations"
    difficulty: medium
    description: "Join streams with songs, artists, and users to compute play counts, completion rates, and discovery patterns."
    grader: src/graders/task_medium_grader.py

  - id: task_hard
    name: "Hard — Tempo Window Functions and CTEs"
    difficulty: hard
    description: "Use window functions, CTEs, and subqueries to uncover viral hits, skip patterns, and listener behaviour."
    grader: src/graders/task_hard_grader.py

  - id: task_analytics
    name: "Analytics — Tempo Revenue and Engagement Metrics"
    difficulty: analytics
    description: "Compute revenue proxies, engagement rates, and cross-dimension breakdowns across genres, artists, and user tiers."
    grader: src/graders/task_analytics_grader.py

  - id: task_realtime
    name: "Realtime — Tempo Time-Series and Trend Analytics"
    difficulty: realtime
    description: "Analyse monthly trends, new releases, recommendation performance, and skip-rate patterns over time."
    grader: src/graders/task_realtime_grader.py

api:
  host: 0.0.0.0
  port: 7860
  endpoints:
    - /reset
    - /step
    - /state
    - /tasks
    - /grader
    - /baseline
    - /health
    - /mcp
